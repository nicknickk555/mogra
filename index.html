<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Yellow Target Intro — an interactive journey from cone interface to moisture gradient and pruning point." />
    <meta name="theme-color" content="#071827" />
    <meta http-equiv="refresh" content="1; url=https://yellow-target-explorer.nicknickk555.chatgpt.site" />
    <link rel="canonical" href="https://yellow-target-explorer.nicknickk555.chatgpt.site" />
    <meta property="og:title" content="Yellow Target Intro" />
    <meta property="og:description" content="Enter the living model of moisture gradients and root pruning." />
    <meta property="og:image" content="https://yellow-target-explorer.nicknickk555.chatgpt.site/og-v2.png" />
    <title>Yellow Target Intro</title>
    <style>
      :root {
        color-scheme: dark;
        --night: #071827;
        --ink: #eaf7ff;
        --cyan: #65e8ff;
        --green: #8affbd;
        --pink: #ff5ea8;
        --violet: #8c62ff;
        --amber: #f4b63f;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 25% 30%, rgba(140, 98, 255, .28), transparent 28%),
          radial-gradient(circle at 80% 65%, rgba(101, 232, 255, .2), transparent 30%),
          var(--night);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(101, 232, 255, .06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(101, 232, 255, .06) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 88%);
      }

      main {
        position: relative;
        width: min(820px, calc(100% - 32px));
        padding: clamp(32px, 7vw, 72px);
        text-align: center;
        border: 1px solid rgba(101, 232, 255, .24);
        border-radius: 28px;
        background: rgba(7, 24, 39, .76);
        box-shadow: 0 30px 100px rgba(0, 0, 0, .42), inset 0 0 55px rgba(101, 232, 255, .04);
        backdrop-filter: blur(18px);
      }

      .ruby {
        width: 62px;
        height: 62px;
        margin: 0 auto 34px;
        transform: rotate(45deg);
        border: 2px solid rgba(255, 255, 255, .82);
        background: linear-gradient(135deg, #fff, var(--pink) 28%, var(--violet) 63%, var(--amber));
        box-shadow: 0 0 32px rgba(255, 94, 168, .65), 0 0 70px rgba(140, 98, 255, .35);
        animation: float 2.4s ease-in-out infinite alternate;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 9vw, 86px);
        line-height: .92;
        letter-spacing: -.065em;
      }

      p {
        max-width: 600px;
        margin: 24px auto 0;
        color: #a9c1d2;
        font-size: clamp(15px, 2.5vw, 19px);
        line-height: 1.65;
      }

      a {
        display: inline-block;
        margin-top: 32px;
        padding: 17px 28px;
        border-radius: 14px;
        background: linear-gradient(110deg, var(--violet), var(--pink) 58%, var(--amber));
        color: white;
        text-decoration: none;
        font-weight: 800;
        box-shadow: 0 14px 34px rgba(140, 98, 255, .28);
      }

      .path {
        margin-top: 28px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      @keyframes float {
        to { transform: translateY(-12px) rotate(45deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ruby { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ruby" aria-hidden="true"></div>
      <h1>Yellow Target Intro</h1>
      <p>Enter the living model of the cone interface, moisture gradient and pruning point.</p>
      <div class="path">Cone Interface · Ruby Target · Moisture Explorer</div>
      <a href="https://yellow-target-explorer.nicknickk555.chatgpt.site">Open the interactive model</a>
    </main>
    <script>
      window.setTimeout(function () {
        window.location.replace("https://yellow-target-explorer.nicknickk555.chatgpt.site");
      }, 900);
    </script>
  </body>
</html>

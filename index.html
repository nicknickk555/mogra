<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yellow Target — a living entrance into the geometry of the cone.">
  <meta name="theme-color" content="#071827">
  <meta property="og:title" content="Yellow Target Intro">
  <meta property="og:description" content="Enter the living mathematical model of moisture gradients and root pruning.">
  <meta property="og:image" content="https://nicknickk555.github.io/mogra/public/og-v2.png">
  <title>Yellow Target Intro</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body class="intro-page">
  <main class="shell intro-shell">
    <header class="intro-header card">
      <p class="eyebrow">Venturi Carpet Technology · Interactive Library</p>
      <h1>Yellow Target Intro</h1>
      <p>A three-stage entrance into the living geometry of the cone.</p>
      <nav class="stage-nav" aria-label="Introduction stages">
        <button class="stage-button active" data-stage="0">Cone Interface</button>
        <span aria-hidden="true">→</span>
        <button class="stage-button" data-stage="1">Ruby Target</button>
        <span aria-hidden="true">→</span>
        <button class="stage-button" data-stage="2">Moisture Explorer</button>
        <button class="play-button" id="playIntro" type="button"><i aria-hidden="true"></i> Play intro</button>
      </nav>
      <div class="portal-doors" aria-label="Entrance portal">
        <button id="openIntro" type="button"><small>Screen 1</small><strong>Experience the living Intro</strong></button>
        <a href="explorer.html"><small>Screen 2</small><strong>Enter the mathematical Explorer</strong><span aria-hidden="true">→</span></a>
      </div>
    </header>

    <section class="portal card stage-0" id="portal" aria-live="polite">
      <div class="portal-visual">
        <i class="glow glow-one"></i>
        <i class="glow glow-two"></i>
        <div class="star-field" aria-hidden="true"></div>
        <div class="model" aria-hidden="true">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <div class="ruby"><i></i></div>
          <div class="target"><span>TARGET</span></div>
          <div class="cone">
            <div class="soil"></div>
            <div class="interface"><span>INTERFACE</span></div>
          </div>
        </div>

        <div class="mini-chart" aria-hidden="true">
          <svg viewBox="0 0 700 330">
            <rect x="55" y="25" width="610" height="245" rx="12" fill="rgba(255,255,255,.04)"/>
            <g stroke="rgba(101,232,255,.12)">
              <path d="M55 86H665M55 147H665M55 208H665M177 25V270M299 25V270M421 25V270M543 25V270"/>
            </g>
            <path class="intro-curve curve-green" d="M55 60 C210 86 350 165 665 245"/>
            <path class="intro-curve curve-blue" d="M55 84 C225 130 360 195 665 252"/>
            <path class="intro-curve curve-purple" d="M55 112 C195 188 390 230 665 258"/>
            <path d="M55 185H665" stroke="#f4b63f" stroke-width="2" stroke-dasharray="9 7"/>
            <circle class="chart-dot dot-green" cx="385" cy="185" r="8"/>
            <circle class="chart-dot dot-blue" cx="315" cy="185" r="8"/>
            <circle class="chart-dot dot-purple" cx="245" cy="185" r="8"/>
            <text x="55" y="306" fill="#fff" font-size="18">C(s*) = Ccrit</text>
          </svg>
        </div>
        <div class="visual-caption" id="visualCaption">Air meets matter</div>
      </div>

      <div class="portal-copy" id="portalCopy">
        <p class="eyebrow" id="stageEyebrow"></p>
        <h2 id="stageTitle"></h2>
        <p id="stageText"></p>
        <div class="logic" id="stageLogic"></div>
        <div class="tags" id="stageTags"></div>
        <div class="progress" aria-hidden="true"><i id="stageProgress"></i></div>
        <button class="primary" id="stageAction" type="button"></button>
        <div class="principle"><i aria-hidden="true"></i><p>The cone forms the target — not a storage pocket.</p></div>
      </div>
    </section>
  </main>
  <script src="intro.js"></script>
</body>
</html>
